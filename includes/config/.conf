server {
    listen 8080;
    host 127.0.0.1;
    server_name my_server;

    root ./www;
    index index.html;
    client_max_body_size 10M;
    error_page 404 /404.html;

    location / {
        allow_methods GET POST;
        autoindex off;
    }

    location /uploads {
        allow_methods GET POST DELETE;
        upload_to /path/to/uploads;
        autoindex on;
    }

    location /cgi-bin {
        allow_methods GET POST;
        cgi_path /usr/bin/python3;
        cgi_extension .py;
    }

    location /old-route {
        return /new-route.html;
    }
}