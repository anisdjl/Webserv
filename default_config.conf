server {
    listen 2500;
    server_name weebserv;
    root www/;
    client_max_body_size 1000000;

    location / {
        root www/;
        root www/htmlup;
        allow_methods GET;
        autoindex off;
        index index.html;
    }

    location /css {
        allow_methods GET;
        autoindex on;
        root www/;
    }

    location /no-autoindex {
        allow_methods GET;
        autoindex off;
        root www/;
    }

    location /upload {
        root www/;
        allow_methods GET POST DELETE;
        upload_store /uploads;
    }

    location /old-path {
        root www/;
        return 301 /css;
    }

    location /cgi-bin {
        root ./www;
        allow_methods GET POST;
        cgi_pass .py /usr/bin/python3;
        cgi_pass .bla ./www/cgi-bin/cgi_tester;
		cgi_pass .php /usr/bin/php-cgi;
    }
}