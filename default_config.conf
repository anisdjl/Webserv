server {
    listen 2500;
    server_name weebserv;
    root www/;
    client_max_body_size 1000000;

    location / {
        allow_methods GET;
        autoindex off;
        root www/;
    }

    location /css {
        allow_methods GET;
        autoindex on;
        root www/;
    }

    location /no-autoindex {
        allow_methods GET;
        autoindex off;
        root www/;
    }

    location /upload {
        root www/;
        allow_methods POST DELETE;
        upload_store /uploads;
    }

    location /cgi-bin {
        allow_methods GET POST;
        root www/cgi-bin;
        cgi_pass .py /usr/bin/python3;
    }

    location /old-path {
        root www/;
        return 301 /css;
    }
}