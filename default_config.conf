server {
	listen 2500;
    host 127.0.0.1;
    server_name localhost;
    client_max_body_size 1000000;

    location / {
        root ./www;
        index index.html;
        allow_methods GET POST;
    }
       
    location /cgi-bin {
        root ./www;
        allow_methods GET POST;
        cgi_pass .py /usr/bin/python3;
        cgi_pass .php /usr/bin/php-cgi;
    }
}
