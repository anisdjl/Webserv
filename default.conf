server {
    listen 8080;
    host 127.0.0.1;
    server_name localhost;
    client_max_body_size 1000000;

    location / {
        root ./www/xylophone/dist;
        index index.html;
        allow_methods GET POST DELETE;
        autoindex off;
    }
}

server {
    listen 2500;
    host 127.0.0.2;
    server_name weebserv;
    client_max_body_size 1000000;

    location / {
        root ./www/htmlup;
        index index.html;
        allow_methods GET POST DELETE;
        autoindex off;
    }
}
