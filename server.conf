server {
    listen 8080;
    host 127.0.0.1;
    server_name webserv.local www.webserv.local;

    client_max_body_size 10485760;

    error_page 404 /errors/404.html;
    error_page 500 /errors/500.html;
    error_page 502 /errors/500.html;
    error_page 503 /errors/500.html;

    location / {
        root /var/www/site1;
        index index.html;
        allow_methods GET POST;
        autoindex off;
    }

    location /downloads {
        root /var/www/site1;
        allow_methods GET;
        autoindex on;
    }

    location /upload {
        root /var/www/site1;
        allow_methods POST DELETE;
        upload_store /var/www/site1/uploads;
    }

    location /old-page {
        root /var/www/site1;
        return 301 /downloads;
    }

    location /cgi-bin {
        root /var/www/site1;
        allow_methods GET POST;
        cgi_pass .py /usr/bin/python3;
        cgi_pass .php /usr/bin/php-cgi;
    }
}

server {
    listen 9091;
    host 127.0.0.1;
    server_name test.com;

    client_max_body_size 1000000;

    location / {
        root /var/www/site2;
        index default.html;
        allow_methods GET;
        autoindex off;
    }
}