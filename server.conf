# ==========================================
# Serveur 1 : Site principal
# ==========================================
server {
    listen 8080; # un commentaire // celle ci est obligatoire, si pas dispo erreur
    host 127.0.0.1;
    server_name webserv.local www.webserv.local;

    # Limite de taille pour les requêtes POST (ici 10 Mo)
    client_max_body_size 10485760;

    # Pages d'erreur personnalisées
    error_page 404 /errors/404.html;
    error_page 500 502 503 /errors/500.html;

    # Route racine par défaut
    location / {
        root /var/www/site1;
        index index.html index.htm;
        allow_methods GET POST;
        autoindex off;
    }

    # Route avec listing de fichiers activé (autoindex)
    location /downloads {
        root /var/www/site1;
        allow_methods GET;
        autoindex on;
    }

    # Route dédiée aux uploads de fichiers
    location /upload {
        root /var/www/site1;
        allow_methods POST DELETE;
        upload_store /var/www/site1/uploads;
    }

    # Redirection HTTP
    location /old-page {
        return 301 /downloads;
    }

    # Gestion des scripts CGI (ex: Python ou PHP)
    location /cgi-bin {
        root /var/www/site1;
        allow_methods GET POST;
        cgi_pass .py /usr/bin/python3;
        cgi_pass .php /usr/bin/php-cgi;
    }
}

# ==========================================
# Serveur 2 : Second site sur un autre port
# ==========================================
server {
    listen 9090;
    host 0.0.0.0;
    server_name test.com;

    client_max_body_size 1000000; # ~1 Mo

    location / {
        root /var/www/site2;
        index default.html;
        allow_methods GET;
        autoindex off;
    }
}